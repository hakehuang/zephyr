# Probe settings for the general ADC power shield
# (board running samples/drivers/adc/adc_power_measure).
#
# Voltage is read on the ADC channels named by each route; the current is then
# I = V / (shunt_resistor * gain).  A route with a single channel measures its
# voltage against ground, a route with both channels measures the drop across
# the shunt.
device_id: "adc_power_monitor_01"

routes:
  - id: 0
    name: "VDD_CORE"
    shunt_resistor: 0.1      # ohms
    gain: 1.0
    type: "single"           # single | differential
    channels:
      channels_p: 4
      channels_n: 0
  - id: 1
    name: "VDD_IO"
    shunt_resistor: 0.1
    gain: 1.0
    type: "single"
    channels:
      channels_p: 7
      channels_n: 3

calibration:
  offset: 0.0
  scale: 1.0
