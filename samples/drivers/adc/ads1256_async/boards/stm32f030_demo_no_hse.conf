# Minimal image for the ADS1256 on the no-HSE board variant (16 KB flash).
CONFIG_SIZE_OPTIMIZATIONS=y
# LTO and locally declared ISR tables must be enabled together; alone, the
# picolibc build overflows flash by several kilobytes.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_GEN_SW_ISR_TABLE=y
CONFIG_MINIMAL_LIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_ADS1256=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_MPSC_PBUF=n
CONFIG_ARM_MPU=n
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
# Single-thread kernel: no scheduler, no thread stacks.
CONFIG_MULTITHREADING=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_TIMEOUT_64BIT=n
