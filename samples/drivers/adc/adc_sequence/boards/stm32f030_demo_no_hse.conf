# Footprint configuration for the STM32F030 demo board (16 KB flash / 4 KB RAM).
CONFIG_SIZE_OPTIMIZATIONS=y
# LTO + locally declared ISR tables are a pair: without the local declaration the
# LTO dependency is not met and both are lost (worth ~1.4 KB on this board).
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_GEN_SW_ISR_TABLE=y
CONFIG_MINIMAL_LIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_MPSC_PBUF=n
CONFIG_ARM_MPU=n
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
# The power shield reads one sequence of SEQUENCE_SAMPLES points per channel.
CONFIG_SEQUENCE_SAMPLES=10
# Single-thread kernel: no scheduler, no thread stacks.
CONFIG_MULTITHREADING=n
CONFIG_KERNEL_MEM_POOL=n
