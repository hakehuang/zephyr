sample:
  name: ADC power shield sample
common:
  tags:
    - adc
  depends_on: adc
  filter: dt_alias_exists("adc0")
  harness: console
  timeout: 10
  # The console harness cannot send input, so only the one-shot header that is
  # printed at boot is checked here.  Measurement lines ("D,<ms>,<raw>...") need a
  # character on the console, hence they are documented in README.rst instead.
  harness_config:
    type: multi_line
    regex:
      - "^#CFG,ch=\\d+,res=\\d+,ref_mv=\\d+,seq=\\d+,avg=\\d+$"
tests:
  sample.drivers.adc.adc_power_shield:
    integration_platforms:
      - nrf52840dk/nrf52840
  sample.drivers.adc.adc_power_shield.8bit:
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_SEQUENCE_RESOLUTION=8
