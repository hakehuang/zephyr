# The A4114 power shield driver can only acquire one sequence sample; that
# restriction does not apply to stm32f030_demo, where 5 samples per channel
# were verified on hardware.
CONFIG_SEQUENCE_SAMPLES=5
CONFIG_SEQUENCE_RESOLUTION=12
# CONFIG_SEQUENCE_32BITS_REGISTERS is not set
#CONFIG_SCHED_SIMPLE=y
#CONFIG_WAITQ_SIMPLE=y
#CONFIG_ARM_MPU=n
CONFIG_GEN_SW_ISR_TABLE=y
#CONFIG_GEN_ISR_TABLES=n
CONFIG_CBPRINTF_NANO=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_CBPRINTF_FULL_INTEGRAL=n

# Memory constraints
CONFIG_MAIN_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=512
CONFIG_HEAP_MEM_POOL_SIZE=0

# ADC minimal
CONFIG_ADC_ASYNC=n
CONFIG_ADC_SHELL=n

CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=n

CONFIG_PM=n
CONFIG_BOOT_BANNER=n
CONFIG_BOOT_DELAY=0

CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_ASSERT=n

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MAX_LEVEL=0
CONFIG_LOG_PRINTK=n
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_BUFFER_SIZE=64

CONFIG_DYNAMIC_INTERRUPTS=n
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

#CONFIG_KERNEL_BIN_NAME="a"

CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=n
CONFIG_PICOLIBC_IO_LONG_LONG=n

