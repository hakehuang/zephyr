# Network overlay for qemu_x86
# Enable networking with ethernet
CONFIG_NET_L2_ETHERNET=y

# Enable network management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Enable network statistics
CONFIG_NET_STATISTICS=y

# Enable network shell for debugging
CONFIG_NET_SHELL=y

# Enable IP configuration with auto-init support
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Enable network buffer management
CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Increase stack sizes for networking
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Enable logging for debugging
CONFIG_NET_LOG=y

# Enable Intel e1000 Ethernet driver
CONFIG_ETH_E1000=y

# Enable PCI Express support required by e1000
CONFIG_PCIE=y
