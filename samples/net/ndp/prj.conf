# NDP Sample Application Configuration

# Enable basic networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y

# Enable IP protocols for checksum support
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# Enable NDP packet processing
CONFIG_NDP_PACKET_PROCESSING=y

# Logging
CONFIG_LOG=y
CONFIG_NDP_SAMPLE_LOG_LEVEL=3

# Network buffers
CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

# Main stack size
CONFIG_MAIN_STACK_SIZE=2048