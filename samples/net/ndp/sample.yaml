sample:
  name: NDP Sample
  description: Network Data Plane callback system demonstration

tests:
  sample.net.ndp:
    tags: net ndp
    platform_allow:
      - qemu_x86
    filter: CONFIG_NETWORKING and CONFIG_NDP_PACKET_PROCESSING
    integration_platforms:
      - qemu_x86
    extra_args: "-DCONFIG_NETWORKING=y -DCONFIG_NDP_PACKET_PROCESSING=y"