# NDP Test Configuration

# Enable networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# Enable Ethernet
CONFIG_NET_L2_ETHERNET=y

# Enable NDP packet processing
CONFIG_NDP_PACKET_PROCESSING=y

# Testing
CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y

# Logging
CONFIG_LOG=y
CONFIG_TEST_LOGGING_DEFAULTS=n

# Network buffers
CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8

# Main stack size
CONFIG_MAIN_STACK_SIZE=2048